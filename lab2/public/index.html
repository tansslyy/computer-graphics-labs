<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЛР №2 — Трисектриса Лоншама</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <canvas id="scene" aria-label="Графік трисектриси Лоншама"></canvas>
    <div class="formula">
      <span class="title">Трисектриса Лоншама</span>
      <span class="eq"><i>r</i> = <i>a</i> / cos 3<i>φ</i></span>
      <span class="eq small"><i>x</i>³ − 3<i>xy</i>² = <i>a</i>(<i>x</i>² + <i>y</i>²)</span>
    </div>
    <div class="hint">Колесо миші — масштаб, перетягування — зсув виду</div>
  </main>

  <aside class="panel">
    <section>
      <h2>Параметри кривої</h2>
      <label class="row">
        <span><i>a</i></span>
        <input type="range" id="a-range" min="0.5" max="10" step="0.05">
        <input type="number" id="a-num" min="0.5" max="10" step="0.05">
      </label>
    </section>

    <section>
      <h2>Точка P на кривій</h2>
      <label class="row">
        <span><i>φ</i>, °</span>
        <input type="range" id="phi-range" min="-89.9" max="89.9" step="0.1">
        <input type="number" id="phi-num" min="-89.9" max="89.9" step="0.1">
      </label>
      <p class="note" id="phi-note"></p>
    </section>

    <section>
      <h2>Відображення</h2>
      <div class="checks">
        <label><input type="checkbox" data-show="grid"> Сітка</label>
        <label><input type="checkbox" data-show="asymptotes"> Асимптоти</label>
        <label><input type="checkbox" data-show="triangle"> Асимпт. трикутник</label>
        <label><input type="checkbox" data-show="point"> Точка P</label>
        <label><input type="checkbox" data-show="tangent"> Дотична</label>
        <label><input type="checkbox" data-show="normal"> Нормаль</label>
        <label class="wide"><input type="checkbox" data-show="segment"> Дуга від вершини і сегмент</label>
      </div>
    </section>

    <section>
      <h2>Анімація</h2>
      <div class="buttons">
        <button type="button" id="anim-a" aria-pressed="false">Змінювати <i>a</i></button>
        <button type="button" id="anim-point" aria-pressed="false">Рухати точку P</button>
      </div>
      <label class="row">
        <span>Швидкість</span>
        <input type="range" id="speed" min="0.25" max="4" step="0.25">
        <output id="speed-out"></output>
      </label>
    </section>

    <section>
      <h2>Евклідові перетворення</h2>
      <div class="grid2">
        <label>Зсув Δx <input type="number" step="0.5" data-tr="dx"></label>
        <label>Зсув Δy <input type="number" step="0.5" data-tr="dy"></label>
        <label>Центр px <input type="number" step="0.5" data-tr="px"></label>
        <label>Центр py <input type="number" step="0.5" data-tr="py"></label>
        <label class="wide">Кут обертання, ° <input type="number" step="5" data-tr="angleDeg"></label>
      </div>
      <details>
        <summary>Матриця перетворення M</summary>
        <table class="matrix" id="matrix"></table>
      </details>
    </section>

    <section class="results">
      <h2>Розрахунки</h2>
      <dl id="results"></dl>
    </section>

    <div class="buttons footer">
      <button type="button" id="reset-view">Скинути вигляд</button>
      <button type="button" id="reset-all">Скинути все</button>
    </div>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
